name: Nexus Nutra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate dependency graph
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Validate JavaScript
        run: node --check static/js/app.js
      - name: Tests
        run: python -m pytest
